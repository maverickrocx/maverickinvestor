name: Deploy MaverickInvestor to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    # Weekly data-refresh jobs commit with the default GITHUB_TOKEN, which
    # does not trigger `on: push` in other workflows — chain off completion
    # instead so a refresh always ends with a redeploy.
    workflows: ["Weekly data refresh"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Upload MaverickInvestor folder as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./MaverickInvestor

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
