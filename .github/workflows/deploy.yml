name: Deploy MaverickInvestor to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    # Data-refresh jobs commit with the default GITHUB_TOKEN, which does not
    # trigger `on: push` in other workflows — chain off completion instead so
    # a refresh always ends with a redeploy. Every workflow that commits site
    # data must be listed here, or its commit waits for the next unrelated push.
    workflows: ["Daily NAV refresh", "Weekly data refresh", "Monthly data review"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Not workflow_run.head_sha: that is the commit the refresh job
        # started from, i.e. the data *before* its own commit, which left the
        # live site one refresh behind. The refresh pushes to main, so take
        # main's tip.
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}

      - name: Upload MaverickInvestor folder as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./MaverickInvestor

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
