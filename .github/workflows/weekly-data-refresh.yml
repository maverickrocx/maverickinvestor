name: Weekly data refresh

on:
  schedule:
    # Saturdays 01:30 UTC = 07:00 IST — well after Friday's close has settled
    # on Yahoo Finance, before the site sees weekend traffic. Half an hour
    # after the daily NAV job so the two rarely push at the same moment.
    - cron: "30 1 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # MF NAV rankings refresh daily instead — see daily-nav-refresh.yml.
      # Stock fundamentals (P/E, ROCE, growth) only change when a company
      # reports, so they refresh monthly — see monthly-review.yml.
      - name: Refresh stock prices
        run: python tools/update_stock_prices.py

      # Warn-only: a drifted scheme code is worth knowing about, but it is not
      # a reason to fail a data refresh. monthly_review.py raises the issue.
      - name: Verify AMFI scheme codes
        run: python tools/verify_scheme_codes.py
        continue-on-error: true

      - name: Commit if changed
        run: |
          git config user.name "maverick-bot"
          git config user.email "noreply@maverickinvestor.in"
          git add MaverickInvestor/stock-screener.html
          git diff --staged --quiet || git commit -m "chore: weekly stock price refresh"
          git pull --rebase origin main
          git push
