name: Weekly data refresh

on:
  schedule:
    # Saturdays 01:00 UTC = 06:30 IST — well after Friday's close data has
    # settled on both mfapi.in and Yahoo Finance, before the site sees
    # weekend traffic.
    - cron: "0 1 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Weekly cadence covers the two things that actually move week to week.
      # Stock fundamentals (P/E, ROCE, growth) only change when a company
      # reports, so they refresh monthly instead — see monthly-review.yml.
      # Separate steps so a failure in one doesn't block the other, and each
      # leaves a clear log to debug from.
      - name: Refresh MF NAV rankings
        run: python tools/rank_funds.py

      - name: Refresh stock prices
        run: python tools/update_stock_prices.py

      # Warn-only: a drifted scheme code is worth knowing about, but it is not
      # a reason to fail a data refresh. monthly_review.py raises the issue.
      - name: Verify AMFI scheme codes
        run: python tools/verify_scheme_codes.py
        continue-on-error: true

      - name: Commit if changed
        run: |
          git config user.name "maverick-bot"
          git config user.email "noreply@maverickinvestor.in"
          git add MaverickInvestor/data/fund-rankings.json MaverickInvestor/stock-screener.html
          git diff --staged --quiet || git commit -m "chore: weekly data refresh (NAV rankings + stock prices)"
          git push
