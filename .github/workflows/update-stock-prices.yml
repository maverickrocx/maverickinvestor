name: Refresh stock prices

on:
  schedule:
    - cron: "40 12 * * 5"   # Fridays 12:40 UTC = 18:10 IST, post market close
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh stock screener prices
        run: |
          cd tools
          python update_stock_prices.py

      - name: Commit if changed
        run: |
          git config user.name "maverick-bot"
          git config user.email "noreply@maverickinvestor.in"
          git add MaverickInvestor/stock-screener.html
          git diff --staged --quiet || git commit -m "chore: weekly stock price refresh"
          git push
